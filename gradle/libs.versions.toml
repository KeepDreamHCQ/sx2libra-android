[versions]
agp = "8.4.0-rc02"
kotlin = "1.9.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
androidxCore = "1.13.1"
androidxAppcompat = "1.7.1"
androidxActivity = "1.8.0"
androidxFragment = "1.6.1"
androidxLifecycle = "2.6.1"
androidxSavedState = "1.2.1"
androidxRecyclerView = "1.3.2"
androidxViewPager2 = "1.1.0"
