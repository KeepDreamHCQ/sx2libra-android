material = { group = "com.google.android.material", name = "material", version.ref = "material" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test-jvm", version.ref = "coroutines" }
mmkv = { group = "com.tencent", name = "mmkv", version.ref = "mmkv" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
pictureselector = { group = "io.github.lucksiege", name = "pictureselector", version.ref = "pictureSelector" }
ucrop = { group = "io.github.lucksiege", name = "ucrop", version.ref = "uCrop" }
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoView" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
gsyvideoplayer = { group = "io.github.carguo", name = "gsyvideoplayer-java", version.ref = "gsyVideoPlayer" }
compress-helper = { group = "com.github.nanchen2251", name = "CompressHelper", version.ref = "compressHelper" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
